name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GAME_NAME: "FightIsland"
  # The itch.io account, which is **not** the GitHub one: the page lives at
  # https://garden-fence.itch.io/fight-island. Guessing it from the repository owner is what put
  # `invalid target (bad user)` at the end of the 0.1.0 release, after the export had already worked.
  ITCH_USER: "garden-fence"
  ITCH_GAME: "fight-island"

# Godot's export templates are cross-platform, so macOS and Windows both export from one Linux
# runner - and then the macOS bundle is re-sealed on a macOS one, because that is the one thing
# Linux cannot do. This repository is public, so macOS minutes are free; on a private repository
# they bill at ten times the rate, and that is the trade to weigh if it ever goes private.
jobs:
  export:
    name: Export macOS and Windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import
        run: godot --headless --import --path "$GITHUB_WORKSPACE"

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p build/macos build/windows
          godot --headless --path "$GITHUB_WORKSPACE" \
            --export-release "macOS" "build/macos/${GAME_NAME}.zip"
          godot --headless --path "$GITHUB_WORKSPACE" \
            --export-release "Windows Desktop" "build/windows/${GAME_NAME}.exe"
          test -f "build/macos/${GAME_NAME}.zip"
          test -f "build/windows/${GAME_NAME}.exe"

      - name: Package Windows
        run: cd build/windows && zip -r "../../${GAME_NAME}-windows-x86_64.zip" .

      - name: Name the macOS archive
        run: cp "build/macos/${GAME_NAME}.zip" "${GAME_NAME}-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: ${{ env.GAME_NAME }}-*.zip
          retention-days: 30

  sign-macos:
    name: Re-seal the macOS bundle
    runs-on: macos-14
    needs: export
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: artifacts

      # **Exported on Linux, sealed on macOS.** Godot's template arrives already signed - the
      # binary carries `Developer ID Application: Prehensile Tales B.V.`, which is the template's
      # own - but a bundle's signature also seals its *resources*, and Godot on Linux cannot write
      # that seal. The `.app` therefore ships with a signature claiming resources that are not
      # there, and macOS reports:
      #
      #     code has no resources but signature indicates they must be present
      #
      # Which the player meets as **"is damaged and can't be opened"** - the hard refusal, with no
      # "Open Anyway" offered in System Settings. An ad-hoc re-seal turns it into the ordinary
      # "unidentified developer", which the player *can* approve. Measured both ways on the 0.1.0
      # archive before this was written.
      #
      # Notarisation (#88) removes the approval step entirely. This only makes it reachable.
      - name: Re-sign the app and check it took
        run: |
          set -euo pipefail
          cd artifacts
          mkdir -p unpacked
          ditto -x -k "${GAME_NAME}-macos-universal.zip" unpacked
          app=$(find unpacked -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          codesign --force --deep --sign - "$app"
          # The verdict that matters. Before the re-seal this line is what fails.
          codesign --verify --deep --strict --verbose=2 "$app"
          test -f "$app/Contents/_CodeSignature/CodeResources"
          # `ditto` rather than `zip`: an .app carries symlinks and metadata that a plain zip
          # flattens, which is its own way of arriving damaged.
          rm "${GAME_NAME}-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "${GAME_NAME}-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: artifacts/*.zip
          overwrite: true
          retention-days: 30

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: sign-macos
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          draft: true

  itch:
    name: Publish to itch.io
    runs-on: ubuntu-24.04
    needs: sign-macos
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: artifacts

      # Skips cleanly until the itch.io page exists and BUTLER_API_KEY is set, so a tag never
      # fails the release just because publishing is not wired up yet.
      - name: Push builds with butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "::warning::BUTLER_API_KEY is not set - skipping the itch.io publish."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip && chmod +x butler
          ./butler push "artifacts/${GAME_NAME}-macos-universal.zip" \
            "${ITCH_USER}/${ITCH_GAME}:mac" --userversion "$VERSION"
          ./butler push "artifacts/${GAME_NAME}-windows-x86_64.zip" \
            "${ITCH_USER}/${ITCH_GAME}:windows" --userversion "$VERSION"
