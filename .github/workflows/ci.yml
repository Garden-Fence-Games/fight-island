name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  lint:
    name: GDScript lint and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit>=4.3,<5"

      - name: Check formatting and lint
        run: |
          # addons/ is vendored third-party code. It is not ours to format, and reformatting it
          # would turn every upgrade of it into a diff nobody can read.
          files=$(git ls-files '*.gd' | grep -v '^addons/')
          if [ -z "$files" ]; then
            echo "No GDScript files yet - skipping."
            exit 0
          fi
          gdformat --check $files
          gdlint $files

  validate:
    name: Import and validate project
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      # Godot exits 0 even when it logs import errors, so the grep below is the real gate.
      # Twice on purpose. The CSV translation importer writes assets/locale/*.translation, which
      # project.godot lists under locale/translations — so on a cold checkout the first pass reads
      # that setting before the file it generates exists. The second pass is the one that has to be
      # clean, and it also proves a cold import converges rather than merely surviving.
      - name: Import project resources
        run: |
          set -o pipefail
          godot --headless --import --path "$GITHUB_WORKSPACE" > /dev/null 2>&1 || true
          godot --headless --import --path "$GITHUB_WORKSPACE" 2>&1 | tee import.log

      - name: Fail on any error or warning
        run: |
          if grep -nE '^(ERROR|WARNING|SCRIPT ERROR|USER ERROR|USER SCRIPT ERROR)' import.log; then
            echo "::error::Godot reported errors or warnings while importing."
            exit 1
          fi
          echo "Import clean."

      - name: Verify input map and physics layers
        run: tools/run-check.sh tools/verify_project_config.gd

      # The pure arithmetic, in a hundred milliseconds, before anything slow gets a chance to run.
      # These cover the shapes the scene checks cannot: what a curve does at wave two hundred, what
      # a save file does when the player has edited it, and the composition rule that reads the same
      # either way round in a diff.
      #
      # `--ignoreHeadlessMode` is gdUnit warning that synthesised InputEvents do not travel in a
      # headless engine. Nothing here touches input — driving real devices is exactly what the scene
      # checks are for, and `verify_aim.tscn` does it.
      - name: Run the unit tests
        run: |
          godot --headless --path "$GITHUB_WORKSPACE" \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a res://tests

      # Booting the real game is worth more than parsing files one by one: --script starts no
      # autoloads, so any script touching the EventBus would fail there for the wrong reason.
      # Boot goes through the intro, so the title and the arena are named explicitly — otherwise
      # 240 frames never reach either of them and the check silently covers the sting alone.
      - name: Boot the game headless
        run: |
          set -o pipefail
          : > run.log
          for scene in "" res://scenes/ui/title_screen.tscn res://scenes/main/main.tscn; do
            godot --headless --path "$GITHUB_WORKSPACE" --quit-after 240 $scene 2>&1 | tee -a run.log
          done
          if grep -nE '^(ERROR|WARNING|SCRIPT ERROR|USER ERROR|USER SCRIPT ERROR)' run.log; then
            echo "::error::Errors or warnings while running the game."
            exit 1
          fi

      - name: Verify the combat loop
        run: tools/run-check.sh res://tools/verify_combat.tscn

      # Effects draw nothing headless, so what is checked is the decisions in them: that a perfect
      # hit differs in more than one way, that the telegraph is a shape rather than a colour — the
      # only form that survives greyscale and twenty metres — and that a fight never builds one.
      # The two accessibility settings are checked as consumers, because both were stored and read
      # by nothing until this.
      - name: Verify the effects
        run: tools/run-check.sh res://tools/verify_vfx.tscn

      # The sounds are generated, so there is no file to listen to and nothing in a diff to read.
      # What is checked is the property the design rests on: a perfect hit rings longer *and*
      # brighter than a plain one, a perfect parry outlasts a late one, and a swing through air has
      # no impact in it. The first run of this caught every sound being cut off mid-ring.
      - name: Verify the hit sounds
        run: tools/run-check.sh res://tools/verify_audio.tscn

      # The HUD is nothing but bus listeners, so nothing about a broken one shows up in a diff:
      # it simply stops updating. This drives every signal it answers and reads the labels back.
      - name: Verify the in-run HUD
        run: tools/run-check.sh res://tools/verify_hud.tscn

      # The options screen is two lists that have to agree — the rows it draws and the settings
      # that exist — plus a rebind that has to reach the InputMap and come back on a reset. None
      # of that is visible in a diff.
      - name: Verify the options screen
        run: tools/run-check.sh res://tools/verify_options.tscn

      # A pause menu that forgets to pause, a dialog a stopped tree cannot process, or an Escape
      # that closes the dialog and the menu under it in the same frame: none of that shows up in a
      # diff, and all of it is a soft lock in front of the player.
      - name: Verify the pause menu
        run: tools/run-check.sh res://tools/verify_pause.tscn

      # A card that says "twenty more hit points" and does not give them is a lie no diff catches,
      # and one purchase a wave is the whole economy — both are checked against a living player.
      - name: Verify the merchant and the run summary
        run: tools/run-check.sh res://tools/verify_merchant.tscn

      # The save file is the one thing in the game the player owns and can edit, so every way it
      # can be wrong is a check: missing, truncated, not an object, or from a build that does not
      # exist yet. None of that is reachable from a diff, and all of it crashes a launch.
      - name: Verify saving and resuming a run
        run: tools/run-check.sh res://tools/verify_save.tscn

      # The tutorial's whole design target is a player who never sees a prompt, and the only way to
      # know that still holds is to land a chained perfect hit and assert three lessons closed at
      # once. Playing it well is exactly the case a human tester never reproduces on purpose.
      - name: Verify the tutorial wave
        run: tools/run-check.sh res://tools/verify_tutorial.tscn

      # "A player on a pad must never read the word mouse" is a sentence, not a type, and the only
      # way it stays true is a check that picks up a controller and reads the screen back.
      - name: Verify the device-aware glyphs
        run: tools/run-check.sh res://tools/verify_glyphs.tscn

      # The stick's 120° arc is a number in a .tres and the sweep it produces is geometry: the only
      # way to know the two still agree is to stand two farmers inside one swing. The gun's half is
      # about *when* it runs dry, which is designed rather than emergent.
      - name: Verify the stick and the gun
        run: tools/run-check.sh res://tools/verify_weapons.tscn

      # The island is generated, so the rules combat depends on have to be checked rather than
      # trusted: a clear spawn pad, a walkable gap between everything that blocks, nothing tall
      # enough to hide a fight from a camera that cannot turn, and water the player can reach.
      - name: Verify the island
        run: tools/run-check.sh res://tools/verify_island.tscn

      # The camera never turns, so a corner the player can be swept in is a corner they can never
      # look their way out of. This walks every square metre of ground the fight can reach and
      # checks a dodge always lands somewhere the reaper's arc does not cover — the "walk every
      # corner" in issue #39, done by a machine because nobody walks nineteen thousand of them.
      - name: Verify the playfield
        run: tools/run-check.sh res://tools/verify_playfield.tscn

      # The navigation mesh comes out of the same generator, and nothing about a wrong one is
      # visible in a diff or a screenshot — enemies simply walk into rocks. This walks one of them
      # around a boulder and checks a spawn point inside the rock is refused.
      # Aiming is wiring between a device and a yaw, and wiring is what breaks. This drives a real
      # joypad event through the engine rather than setting a field.
      - name: Verify aiming
        run: tools/run-check.sh res://tools/verify_aim.tscn

      # A wave is the one thing a player experiences end to end, and every number in it comes from
      # a resource the design document also describes. This asserts the two still agree.
      - name: Verify waves
        run: tools/run-check.sh res://tools/verify_waves.tscn

      # The rig is wired by name, and names drift: a reimport renames a glTF node, an action is
      # exported as "mixamo.com" instead of "walk", and the character silently stops moving with
      # nothing in the log. This asserts the lookup still resolves and that Move actually walks.
      - name: Verify animation
        run: tools/run-check.sh res://tools/verify_animation.tscn

      # glTF puts a character's front at +Z, Godot's forward is -Z, and nothing reconciles them: a
      # rig imported without the 180 on its instance aims out of its own back. Cheap to check,
      # invisible in a diff, and it also guards the head-look's bone axis across a reimport.
      - name: Verify head look
        run: tools/run-check.sh res://tools/verify_head_look.tscn

      - name: Verify navigation
        run: tools/run-check.sh res://tools/verify_navigation.tscn

      # The turn of the day is a wave coefficient and a look at once, and the two are easy to drift
      # apart. This asserts the phases tile a whole day, that the clock only ever goes forward, and
      # that night is meaner without being darker than a telegraph can be read through.
      - name: Verify day and night
        run: tools/run-check.sh res://tools/verify_day_night.tscn

      # The renderer draws nothing here, so this asserts which occluder should fade and by how much
      # — the decision — rather than the pixels. The dither that turns a fade into holes has no
      # decisions in it.
      - name: Verify camera occlusion
        run: tools/run-check.sh res://tools/verify_camera.tscn

      # A tuning record nobody can trust is worse than none: a column that silently carries the run's
      # running total instead of the wave's own reads perfectly plausible and would send a balance
      # pass the wrong way. This also holds the release build's half of the promise — a recorder
      # nobody armed leaves no file behind.
      - name: Verify the telemetry record
        run: tools/run-check.sh res://tools/verify_telemetry.tscn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: |
            import.log
            run.log
          retention-days: 7

  guard:
    name: Repository guard rails
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: No generated Godot cache in git
        run: |
          if git ls-files -- '.godot' '.godot/*' | grep -q .; then
            echo "::error::.godot/ is tracked. It is generated cache and it holds export_credentials.cfg."
            git ls-files -- '.godot' '.godot/*'
            exit 1
          fi

      - name: No C# or .NET in the project
        run: |
          if git ls-files -- '*.cs' '*.csproj' '*.sln' | grep -q .; then
            echo "::error::This project is GDScript only. Remove the C#/.NET files."
            git ls-files -- '*.cs' '*.csproj' '*.sln'
            exit 1
          fi
          if grep -q '^\[dotnet\]' project.godot; then
            echo "::error::The [dotnet] block was removed from project.godot on purpose."
            exit 1
          fi

      - name: Import sidecars stay versioned
        run: |
          if git check-ignore -q -- assets/_probe.png.import; then
            echo "::error::*.import sidecars are ignored. They carry resource UIDs and must be committed."
            exit 1
          fi
          echo "Sidecars are versioned."

      - name: Binary assets go through Git LFS
        # .gitattributes decides what must be LFS; this checks the blob really is a pointer,
        # which is what a commit made without `git lfs install` silently gets wrong.
        run: |
          failed=0
          while IFS= read -r -d '' path && IFS= read -r -d '' _attr && IFS= read -r -d '' value; do
            [ "$value" = "lfs" ] || continue
            # A pointer is ~130 bytes, so size alone separates it from a real blob.
            if [ "$(git cat-file -s "HEAD:$path")" -gt 1024 ] \
              || case "$(git cat-file blob "HEAD:$path")" in
                   version\ https://git-lfs.github.com/spec/*) false ;;
                   *) true ;;
                 esac; then
              echo "::error file=$path::$path is declared LFS in .gitattributes but was committed as a real blob."
              failed=1
            fi
          done < <(git ls-files -z | git check-attr -z --stdin filter)
          if [ "$failed" -ne 0 ]; then
            echo "::error::Run 'git lfs install', then re-add these files."
            exit 1
          fi
          echo "Every LFS-declared file is a pointer."


  pr-hygiene:
    name: Pull request hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      CONVENTIONAL: '^(art|build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._-]+\))?!?: [^ ].{0,62}$'
    steps:
      - name: Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$PR_TITLE" | grep -qE "$CONVENTIONAL"; then
            echo "::error::PR title is not a Conventional Commit subject: $PR_TITLE"
            exit 1
          fi

      - name: Conventional Commits subjects, no trailers
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          # Merge commits are skipped, and base64 keeps a multi-line message on one line here.
          gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/commits" \
            --jq '.[] | select((.parents | length) < 2) | [.sha, (.commit.message | @base64)] | @tsv' \
            > commits.tsv
          failed=0
          while IFS=$'\t' read -r sha encoded; do
            message=$(printf '%s' "$encoded" | base64 -d)
            subject=$(printf '%s\n' "$message" | head -1)
            short=${sha:0:8}
            if ! printf '%s' "$subject" | grep -qE "$CONVENTIONAL"; then
              echo "::error::$short is not a Conventional Commit subject: $subject"
              failed=1
            fi
            if printf '%s\n' "$message" | grep -qiE '^(Co-authored-by|Signed-off-by):'; then
              echo "::error::$short carries a trailer. Subject line only, no co-author trailer."
              failed=1
            fi
            if [ "$(printf '%s\n' "$message" | sed '/^[[:space:]]*$/d' | wc -l)" -gt 1 ]; then
              echo "::warning::$short has a commit body. The convention is a subject line only."
            fi
          done < commits.tsv
          exit $failed

  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    needs: [lint, validate, guard, pr-hygiene]
    if: always()
    steps:
      # The single required check in the ruleset, so adding a job never means editing the ruleset.
      - name: Every job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          bad=$(printf '%s' "$NEEDS" | jq -r 'to_entries
            | map(select(.value.result != "success" and .value.result != "skipped") | .key)
            | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::These jobs did not succeed: $bad"
            exit 1
          fi
          echo "CI gate green."
