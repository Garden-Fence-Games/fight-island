name: Feature request
description: Something the game should do and does not.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is unsatisfying today. Not the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [player, enemy, weapons, camera, waves, economy, ui, audio, build, docs, other]
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Which milestone does this belong to
      options: [M1 prototype, M2 vertical slice, M3 content, M4 polish, M5 release, unsure]
